<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PAUTA BDS</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #02122c;
      --panel:   #071a3e;
      --surface: #0a2150;
      --border:  #0e3272;
      --accent:  #ffb700;
      --accent-d:#cc8f00;
      --blue:    #006ee6;
      --text:    #e8edf5;
      --muted:   #4a6fa5;
      --error:   #e03030;
      --success: #1a7a3a;
      --radius:  10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: #010812;
      color: var(--text);
      height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%; height: 100%; max-width: 420px;
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(8px); }
    }
    .app.leaving { animation: fadeDown 0.22s ease both; }
    @media (min-width: 440px) {
      .app { height: 94vh; max-height: 900px; border-radius: 20px; border: 2px solid #0a1a3a; }
    }

    /* ── Header ── */
    header {
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-link {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      text-decoration: none; transition: color 0.15s, border-color 0.15s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }
    .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); }
    .header-title span { color: var(--accent); }
    .header-badge {
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 10px;
      color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px;
    }

    /* ── Tabs ── */
    .tabs-nav {
      display: flex; flex-shrink: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 12px 0;
      background: transparent; border: none;
      color: var(--muted);
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 12px; letter-spacing: 0;
      cursor: pointer; transition: color 0.2s;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Scroll area ── */
    .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .scroll::-webkit-scrollbar { width: 3px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tab-pane { display: none; flex-direction: column; gap: 12px; }
    .tab-pane.active { display: flex; }

    /* ── Form elements ── */
    .field-label {
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 11px; letter-spacing: 0;
      color: var(--muted); margin-bottom: 6px; display: block; text-transform: none;
    }

    .radio-grid { display: grid; gap: 8px; }
    .radio-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    .radio-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .radio-opt { display: none; }
    .radio-label {
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 11px 8px; cursor: pointer; text-align: center;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0;
      color: var(--muted); transition: all 0.15s; line-height: 1.3;
    }
    .radio-opt:checked + .radio-label {
      background: rgba(255,183,0,0.1); border-color: var(--accent);
      color: var(--accent); box-shadow: 0 0 0 1px var(--accent);
    }

    .input-field {
      width: 100%; padding: 13px 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .input-field:focus { border-color: var(--accent); background: #0d2860; }
    .input-field::placeholder { color: var(--muted); }
    .input-field.erro { border-color: var(--error); }

    .input-field.black-font {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 13px; text-transform: none;
    }

    textarea.input-field {
      resize: none; min-height: 80px; line-height: 1.5;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Autocomplete */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); z-index: 50; display: none;
      max-height: 180px; overflow-y: auto;
    }
    .autocomplete-list div {
      padding: 11px 14px; cursor: pointer;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px;
      color: var(--text); border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .autocomplete-list div:last-child { border-bottom: none; }
    .autocomplete-list div:hover, .autocomplete-list div.ativo { background: var(--surface); color: var(--accent); }

    .promo-wrap { display: flex; align-items: center; gap: 10px; }
    .promo-check-hidden { display: none; }
    .promo-toggle {
      display: flex; align-items: center; justify-content: center;
      padding: 13px 14px; min-width: 80px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px;
      color: var(--muted); transition: all 0.15s;
    }
    .promo-check-hidden:checked + .promo-toggle {
      background: rgba(255,183,0,0.1); border-color: var(--accent); color: var(--accent);
    }

    /* ── Submit button ── */
    .btn-submit-wrap { position: relative; border-radius: var(--radius); overflow: hidden; }
    .btn-submit-wrap.loading::before {
      content: ''; position: absolute; inset: -50%;
      background: conic-gradient(from 0deg, transparent 70%, var(--accent) 100%);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-submit {
      position: relative; z-index: 1;
      width: 100%; padding: 16px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0;
      cursor: pointer; box-shadow: 0 4px 0 var(--accent-d);
      transition: all 0.1s;
    }
    .btn-submit:hover { background: #ffc520; }
    .btn-submit:active { transform: translateY(3px); box-shadow: none; }
    .btn-submit:disabled { cursor: not-allowed; }
    .btn-submit-wrap.loading .btn-submit { background: var(--panel); color: var(--accent); box-shadow: none; }
    .btn-submit.ok { background: #1a7a3a; color: #fff; box-shadow: 0 4px 0 #0d4820; }

    /* ── Cronograma ── */
    .crono-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .crono-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; color: var(--accent); line-height: 1;
    }
    .crono-count small { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; color: var(--muted); display: block; margin-top: 2px; }
    .btn-limpar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: rgba(224,48,48,0.1); border: 1px solid rgba(224,48,48,0.3);
      border-radius: var(--radius); color: #e05050;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-limpar:hover { background: rgba(224,48,48,0.2); }

    .data-grupo { margin-bottom: 20px; }
    .data-badge {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 11px;
      color: var(--bg); background: var(--accent);
      padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px;
    }

    .card-post {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 3px solid var(--blue);
      border-radius: var(--radius); padding: 13px 14px;
      display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px;
    }
    .card-post.squad { border-left-color: var(--accent); }

    .card-hora { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; color: var(--accent); }
    .card-canal { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; color: var(--muted); }
    .card-titulo { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); line-height: 1.3; }
    .card-meta { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); }
    .card-acoes { display: flex; gap: 7px; margin-top: 6px; }
    .btn-acao {
      flex: 1; padding: 8px 4px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      border: 1px solid var(--border); border-radius: 7px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px;
      cursor: pointer; background: transparent; color: var(--muted);
      transition: all 0.15s;
    }
    .btn-acao.ver:hover { color: var(--text); border-color: var(--text); }
    .btn-acao.editar { color: var(--accent); border-color: rgba(255,183,0,0.3); }
    .btn-acao.editar:hover { background: rgba(255,183,0,0.08); }
    .btn-acao.deletar { color: #e05050; border-color: rgba(224,48,48,0.3); }
    .btn-acao.deletar:hover { background: rgba(224,48,48,0.08); }

    .vazio { text-align: center; padding: 40px 0; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(1,8,18,0.92);
      z-index: 100; display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--panel); border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 14px; width: 100%; max-width: 400px;
      padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.8);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; color: var(--accent);
      text-align: center; margin-bottom: 14px;
      border-bottom: 1px solid var(--border); padding-bottom: 14px; line-height: 1.3;
    }
    .modal-body {
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400;
      line-height: 1.65; color: var(--text); white-space: pre-wrap;
    }
    .modal-body strong { font-family: 'Inter', sans-serif; font-weight: 700; color: var(--accent); }
    .btn-fechar {
      width: 100%; padding: 13px; margin-top: 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px;
      cursor: pointer; transition: border-color 0.15s;
    }
    .btn-fechar:hover { border-color: var(--accent); }

    /* ── Edit modal ── */
    .modal-edit-box {
      background: var(--bg); border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 14px; width: 100%; max-width: 400px;
      padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-edit-box::-webkit-scrollbar { width: 3px; }
    .modal-edit-box::-webkit-scrollbar-thumb { background: var(--border); }
    .edit-section { display: flex; flex-direction: column; gap: 12px; }
    .edit-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--accent); text-align: center;
      border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 2px;
    }
    .edit-select {
      width: 100%; padding: 13px 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px;
      outline: none; cursor: pointer; appearance: none;
    }
    .edit-select:focus { border-color: var(--accent); }
    .edit-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .btn-salvar-edit {
      padding: 13px; background: var(--accent); color: var(--bg);
      border: none; border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
      cursor: pointer; box-shadow: 0 3px 0 var(--accent-d);
    }
    .btn-salvar-edit:active { transform: translateY(3px); box-shadow: none; }
    .btn-cancelar-edit {
      padding: 13px; background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
      cursor: pointer;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: var(--bg);
      padding: 10px 20px; border-radius: 20px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px;
      z-index: 9999; transition: transform 0.25s; pointer-events: none; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.erro { background: var(--error); color: #fff; }
    #toast.ok   { background: #1a7a3a; color: #fff; }
  </style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="header-left">
      <a href="#" onclick="ir('hub.html')" class="back-link" title="Voltar ao Hub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="header-title">Pautas <span>Diárias</span></div>
    </div>
    <div class="header-badge">v2.0</div>
  </header>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="openTab('tForm', this)">Formulário</button>
    <button class="tab-btn" onclick="openTab('tCrono', this)">Cronograma</button>
  </div>

  <div class="scroll">

    <!-- TAB: FORMULÁRIO -->
    <div id="tForm" class="tab-pane active">

      <div>
        <span class="field-label">Canal</span>
        <div class="radio-grid cols-2">
          <div><input type="radio" id="c-sorte" name="canal" value="SORTE TV" class="radio-opt"><label for="c-sorte" class="radio-label">Sorte TV</label></div>
          <div><input type="radio" id="c-squad" name="canal" value="SQUAD DA SORTE" class="radio-opt"><label for="c-squad" class="radio-label">Squad</label></div>
        </div>
      </div>

      <div class="row-2">
        <div>
          <span class="field-label">Data</span>
          <input type="text" id="fData" class="input-field black-font" placeholder="DD/MM" maxlength="5" autocomplete="off">
        </div>
        <div>
          <span class="field-label">Hora</span>
          <input type="text" id="fHora" class="input-field black-font" placeholder="HHMM" maxlength="4" autocomplete="off">
        </div>
      </div>

      <div>
        <span class="field-label">Título do Post</span>
        <input type="text" id="fTitulo" class="input-field black-font" placeholder="Título do post" autocomplete="off">
      </div>

      <div>
        <span class="field-label">Assunto</span>
        <div class="row-2">
          <div class="autocomplete-wrap" style="position:relative;">
            <input type="text" id="fAssunto" class="input-field black-font" placeholder="Assunto" autocomplete="off">
            <div id="listaAssuntos" class="autocomplete-list"></div>
          </div>
          <div>
            <input type="checkbox" id="fPromo" class="promo-check-hidden">
            <label for="fPromo" class="promo-toggle">Promo</label>
          </div>
        </div>
      </div>

      <div>
        <span class="field-label">Categoria</span>
        <div class="radio-grid cols-2" style="grid-template-columns: 1fr 1fr; gap: 8px;">
          <div><input type="radio" id="cat-cf" name="categoria" value="CONTEUDO FEED" class="radio-opt"><label for="cat-cf" class="radio-label" style="font-size:9px;">Conteúdo<br>Feed</label></div>
          <div><input type="radio" id="cat-nf" name="categoria" value="NOTICIA FEED" class="radio-opt"><label for="cat-nf" class="radio-label" style="font-size:9px;">Notícia<br>Feed</label></div>
          <div><input type="radio" id="cat-cr" name="categoria" value="CONTEUDO REELS" class="radio-opt"><label for="cat-cr" class="radio-label" style="font-size:9px;">Conteúdo<br>Reels</label></div>
          <div><input type="radio" id="cat-nr" name="categoria" value="NOTICIA REELS" class="radio-opt"><label for="cat-nr" class="radio-label" style="font-size:9px;">Notícia<br>Reels</label></div>
        </div>
      </div>

      <div>
        <span class="field-label">Direcionamento</span>
        <textarea id="fDirecionamento" class="input-field" rows="3" placeholder="Direcionamento do post..."></textarea>
      </div>

      <div class="btn-submit-wrap" id="btnWrap">
        <button class="btn-submit" id="btnAdicionar" onclick="enviar()">Adicionar Pauta</button>
      </div>

    </div>

    <!-- TAB: CRONOGRAMA -->
    <div id="tCrono" class="tab-pane">
      <div class="crono-header">
        <div class="crono-count">
          <span id="cronoTotal">0</span>
          <small>Posts agendados</small>
        </div>
        <button class="btn-limpar" onclick="limparCronograma()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Limpar
        </button>
      </div>
      <div id="listaCronograma"></div>
    </div>

  </div>

</div><!-- .app -->

<!-- Modal Ver -->
<div class="modal-overlay" id="modalVer">
  <div class="modal-box">
    <div class="modal-title" id="mVerTitulo"></div>
    <div class="modal-body" id="mVerBody"></div>
    <button class="btn-fechar" onclick="fecharModal('modalVer')">Fechar</button>
  </div>
</div>

<!-- Modal Editar -->
<div class="modal-overlay" id="modalEditar">
  <div class="modal-edit-box">
    <div class="edit-title">Editar Post</div>
    <div class="edit-section">
      <div>
        <span class="field-label">Canal</span>
        <div class="radio-grid cols-2">
          <div><input type="radio" id="eCanal-s" name="eCanal" value="SORTE TV" class="radio-opt"><label for="eCanal-s" class="radio-label" style="padding:10px;">Sorte TV</label></div>
          <div><input type="radio" id="eCanal-q" name="eCanal" value="SQUAD DA SORTE" class="radio-opt"><label for="eCanal-q" class="radio-label" style="padding:10px;">Squad</label></div>
        </div>
      </div>
      <div class="row-2">
        <div><span class="field-label">Data</span><input type="text" id="eData" class="input-field black-font" maxlength="5" placeholder="DD/MM"></div>
        <div><span class="field-label">Hora</span><input type="text" id="eHora" class="input-field black-font" maxlength="5" placeholder="HHH00"></div>
      </div>
      <div><span class="field-label">Título</span><input type="text" id="eTitulo" class="input-field black-font"></div>
      <div><span class="field-label">Assunto</span><input type="text" id="eAssunto" class="input-field black-font"></div>
      <div>
        <span class="field-label">Categoria</span>
        <select id="eCategoria" class="edit-select">
          <option value="CONTEUDO FEED">Conteúdo Feed</option>
          <option value="NOTICIA FEED">Notícia Feed</option>
          <option value="CONTEUDO REELS">Conteúdo Reels</option>
          <option value="NOTICIA REELS">Notícia Reels</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="ePromo" style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer;">
        <label for="ePromo" style="font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer;">Promoção</label>
      </div>
      <div><span class="field-label">Direcionamento</span><textarea id="eDirecionamento" class="input-field" rows="3"></textarea></div>
      <div class="edit-btns">
        <button class="btn-salvar-edit" onclick="salvarEdicao()">Salvar</button>
        <button class="btn-cancelar-edit" onclick="fecharModal('modalEditar')">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ── Config ── */
  const CFG = {
    planilha:    'https://script.google.com/macros/s/AKfycbzY9MI4F_k3kHKySAFseTrUOia-OrgtatCBVHp2KBVSvtP3usJgLZR32SLcUk0Nc4XbDA/exec',
    trelloKey:   'af31fbdd5645cb79b866a7329a2c26d1',
    trelloToken: 'ATTA19cac2fddf8770fe1f5ab10fd380f864993790c3a8fa5f85fd82a5f40052e36b08ADD7AC',
    trelloList:  '68e80f4686f239d2aeca1f32',
    membros: [
      '65a67a55526b51ed32720aa1','678e7838e09f883754186aac','67b37c2566aeea75532fd6a7',
      '68237d794f894f3376f18a4d','688a390bbb9c27344135f8ce','67d1da89cb1b4d81df684622',
      '69ef696ed4eb7735eac76c52','63610ab1ad4010038cd536a4','6516aa5a10ba65ffed1bae5d',
      '6967ca46aaca3a3f76a642f8'
    ]
  };

  const ASSUNTOS = ['BRASIL','BRASILEIRAO','CASSINO','CHAMPIONS','COBERTURA','COPA','DESAFIO',
    'FUT EUROPA','FUT MUNDO','FUT SULAMERICA','INFLUENCIADOR','INSTITUCIONAL','LIVE',
    'MAGUARY','PAYSANDU','SANTA CRUZ','VILA NOVA'];

  let dbPosts = JSON.parse(localStorage.getItem('bdsPosts') || '[]');
  let editIdx = -1;
  let focusAuto = -1;

  /* ── Tab ── */
  function openTab(id, el) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if (id === 'tCrono') renderCronograma();
  }

  /* ── Toast ── */
  function toast(msg, tipo = '', dur = 2600) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show ' + tipo;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = '', dur);
  }

  /* ── Modal ── */
  function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

  /* ── Autocomplete ── */
  const inpAssunto = document.getElementById('fAssunto');
  const divAuto    = document.getElementById('listaAssuntos');

  function renderAuto(filtro = '') {
    const f = filtro.toUpperCase();
    const itens = ASSUNTOS.filter(a => a.includes(f));
    divAuto.innerHTML = '';
    itens.forEach(item => {
      const el = document.createElement('div');
      el.textContent = item;
      el.onclick = () => { inpAssunto.value = item; divAuto.style.display = 'none'; focusAuto = -1; };
      divAuto.appendChild(el);
    });
    divAuto.style.display = itens.length ? 'block' : 'none';
  }

  inpAssunto.addEventListener('click', () => renderAuto(''));
  inpAssunto.addEventListener('input', function() { focusAuto = -1; renderAuto(this.value); });
  inpAssunto.addEventListener('keydown', function(e) {
    const itens = divAuto.querySelectorAll('div');
    if (!itens.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); focusAuto = Math.min(focusAuto + 1, itens.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusAuto = Math.max(focusAuto - 1, 0); }
    else if (e.key === 'Enter') { e.preventDefault(); if (itens[focusAuto]) itens[focusAuto].click(); return; }
    itens.forEach((it, i) => it.classList.toggle('ativo', i === focusAuto));
  });
  document.addEventListener('click', e => { if (e.target !== inpAssunto) divAuto.style.display = 'none'; });

  /* ── Formatação inputs ── */
  document.getElementById('fData').addEventListener('blur', function() {
    const v = this.value.replace(/\D/g, '');
    if (v.length >= 4) {
      this.value = v.substring(0,2) + '/' + v.substring(2,4);
      this.classList.remove('erro');
    } else if (v) { this.classList.add('erro'); }
  });

  document.getElementById('fHora').addEventListener('blur', function() {
    const v = this.value.replace(/\D/g, '');
    if (v.length >= 2) {
      const h = parseInt(v.substring(0,2));
      const m = v.length >= 4 ? parseInt(v.substring(2,4)) : 0;
      if (h <= 23 && m <= 59) {
        this.value = String(h).padStart(2,'0') + 'H' + String(m).padStart(2,'0');
        this.classList.remove('erro');
      } else { this.classList.add('erro'); }
    } else if (v) { this.classList.add('erro'); }
  });

  /* ── Validação ── */
  function validarData(v) { return /^\d{2}\/\d{2}$/.test(v); }
  function validarHora(v) { return /^\d{2}H\d{2}$/.test(v); }

  /* ── Envio ── */
  async function enviar() {
    const canal     = document.querySelector('input[name="canal"]:checked');
    const categoria = document.querySelector('input[name="categoria"]:checked');
    const data      = document.getElementById('fData').value.trim();
    const hora      = document.getElementById('fHora').value.trim();
    const titulo    = document.getElementById('fTitulo').value.trim().toUpperCase();
    const assunto   = document.getElementById('fAssunto').value.trim().toUpperCase();
    const dir       = document.getElementById('fDirecionamento').value.trim().toUpperCase();
    const isPromo   = document.getElementById('fPromo').checked;

    if (!canal)     { toast('Selecione o canal!', 'erro'); return; }
    if (!categoria) { toast('Selecione a categoria!', 'erro'); return; }
    if (!validarData(data)) { toast('Data inválida! Use DD/MM', 'erro'); document.getElementById('fData').classList.add('erro'); return; }
    if (!validarHora(hora)) { toast('Hora inválida! Use HHMM', 'erro'); document.getElementById('fHora').classList.add('erro'); return; }
    if (!titulo)    { toast('Preencha o título!', 'erro'); return; }
    if (!assunto)   { toast('Preencha o assunto!', 'erro'); return; }

    const post = { canal: canal.value, data, hora, titulo, assunto, categoria: categoria.value, direcionamento: dir, isPromo };

    const btn  = document.getElementById('btnAdicionar');
    const wrap = document.getElementById('btnWrap');
    btn.disabled = true; btn.textContent = 'Enviando...'; wrap.classList.add('loading');

    // Google Sheets
    try { await fetch(CFG.planilha + '?dados=' + encodeURIComponent(JSON.stringify(post)), { method:'GET', mode:'no-cors' }); } catch(e) {}

    // Trello
    await criarCardTrello(post);

    wrap.classList.remove('loading');
    btn.classList.add('ok'); btn.textContent = 'Adicionado ✓';

    dbPosts.push(post);
    localStorage.setItem('bdsPosts', JSON.stringify(dbPosts));

    limparForm();
    abrirVer(post);

    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'Adicionar Pauta'; btn.disabled = false; }, 2500);
  }

  async function criarCardTrello(post) {
    try {
      const assuntoLabel = post.assunto + (post.isPromo ? ' PROMO' : '');
      const nome = `${post.canal} | ${assuntoLabel} — ${post.titulo} [${post.data} ${post.hora}]`;
      const desc = `CANAL: ${post.canal}\nAGENDAMENTO: ${post.data} ÀS ${post.hora}\nCATEGORIA: ${post.categoria}\nASSUNTO: ${assuntoLabel}\n\nDIRECIONAMENTO:\n${post.direcionamento || 'Nenhum.'}`;

      const due = new Date(); due.setHours(20,0,0,0);

      // Define cor da capa por categoria
      const cat = post.categoria;
      let cover = null;
      if (cat === 'CONTEUDO FEED' || cat === 'NOTICIA FEED')   cover = { color: 'lime',   size: 'full', brightness: 'light' };
      if (cat === 'CONTEUDO REELS' || cat === 'NOTICIA REELS') cover = { color: 'purple', size: 'full', brightness: 'light' };

      const cardBody = { idList: CFG.trelloList, name: nome, desc, due: due.toISOString(), idMembers: CFG.membros };
      if (cover) cardBody.cover = cover;

      const resp = await fetch(`https://api.trello.com/1/cards?key=${CFG.trelloKey}&token=${CFG.trelloToken}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cardBody)
      });
      if (!resp.ok) { toast('Erro ao criar card no Trello', 'erro'); return; }

      const card = await resp.json();

      // Garante a capa mesmo se o Trello ignorou no POST
      if (cover) {
        await fetch(`https://api.trello.com/1/cards/${card.id}?key=${CFG.trelloKey}&token=${CFG.trelloToken}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cover })
        });
      }

      toast('Card criado no Trello!', 'ok');
    } catch(e) { toast('Erro de conexão com Trello', 'erro'); }
  }

  function limparForm() {
    document.querySelectorAll('input[name="canal"]').forEach(r => r.checked = false);
    document.querySelectorAll('input[name="categoria"]').forEach(r => r.checked = false);
    ['fData','fHora','fTitulo','fAssunto','fDirecionamento'].forEach(id => {
      const el = document.getElementById(id);
      el.value = ''; el.classList.remove('erro');
    });
    document.getElementById('fPromo').checked = false;
  }

  /* ── Cronograma ── */
  function horaEmMin(h) {
    const p = h.split('H');
    return (parseInt(p[0]) || 0) * 60 + (parseInt(p[1]) || 0);
  }

  function renderCronograma() {
    const div = document.getElementById('listaCronograma');
    document.getElementById('cronoTotal').textContent = dbPosts.length;
    div.innerHTML = '';

    if (!dbPosts.length) {
      div.innerHTML = '<div class="vazio">Nenhum post agendado ainda.</div>';
      return;
    }

    const porData = {};
    dbPosts.forEach((p, i) => {
      if (!porData[p.data]) porData[p.data] = [];
      porData[p.data].push({ ...p, idx: i });
    });

    Object.keys(porData).sort().forEach(data => {
      const grupo = document.createElement('div');
      grupo.className = 'data-grupo';

      const badge = document.createElement('div');
      badge.className = 'data-badge';
      badge.textContent = data;
      grupo.appendChild(badge);

      porData[data].sort((a, b) => horaEmMin(a.hora) - horaEmMin(b.hora)).forEach(post => {
        const card = document.createElement('div');
        card.className = 'card-post' + (post.canal === 'SQUAD DA SORTE' ? ' squad' : '');

        const assuntoLabel = post.assunto + (post.isPromo ? ' PROMO' : '');

        card.innerHTML = `
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;">
            <span class="card-hora">${post.hora}</span>
            <span class="card-canal">${post.canal}</span>
          </div>
          <div class="card-titulo">${post.titulo}</div>
          <div class="card-meta">${post.categoria} · ${assuntoLabel}</div>
          <div class="card-acoes">
            <button class="btn-acao ver" onclick='abrirVer(${JSON.stringify(post)})'>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Ver
            </button>
            <button class="btn-acao editar" onclick="abrirEditar(${post.idx})">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              Editar
            </button>
            <button class="btn-acao deletar" onclick="deletar(${post.idx})">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Excluir
            </button>
          </div>
        `;
        grupo.appendChild(card);
      });

      div.appendChild(grupo);
    });
  }

  function abrirVer(post) {
    const assuntoLabel = post.assunto + (post.isPromo ? ' PROMO' : '');
    document.getElementById('mVerTitulo').textContent = `${post.canal} · ${post.data} ${post.hora}`;
    document.getElementById('mVerBody').innerHTML =
      `<strong>TÍTULO</strong>\n${post.titulo}\n\n` +
      `<strong>CATEGORIA</strong>\n${post.categoria}\n\n` +
      `<strong>ASSUNTO</strong>\n${assuntoLabel}\n\n` +
      `<strong>DIRECIONAMENTO</strong>\n${post.direcionamento || 'Nenhum informado.'}`;
    document.getElementById('modalVer').classList.add('open');
  }

  function abrirEditar(idx) {
    editIdx = idx;
    const p = dbPosts[idx];
    document.querySelectorAll('input[name="eCanal"]').forEach(r => r.checked = r.value === p.canal);
    document.getElementById('eData').value = p.data;
    document.getElementById('eHora').value = p.hora;
    document.getElementById('eTitulo').value = p.titulo;
    document.getElementById('eAssunto').value = p.assunto;
    document.getElementById('eCategoria').value = p.categoria;
    document.getElementById('ePromo').checked = p.isPromo || false;
    document.getElementById('eDirecionamento').value = p.direcionamento || '';
    document.getElementById('modalEditar').classList.add('open');
  }

  function salvarEdicao() {
    if (editIdx < 0) return;
    const canal = document.querySelector('input[name="eCanal"]:checked');
    if (!canal) { toast('Selecione o canal!', 'erro'); return; }
    dbPosts[editIdx] = {
      ...dbPosts[editIdx],
      canal: canal.value,
      data:  document.getElementById('eData').value.trim(),
      hora:  document.getElementById('eHora').value.trim(),
      titulo: document.getElementById('eTitulo').value.trim().toUpperCase(),
      assunto: document.getElementById('eAssunto').value.trim().toUpperCase(),
      categoria: document.getElementById('eCategoria').value,
      isPromo: document.getElementById('ePromo').checked,
      direcionamento: document.getElementById('eDirecionamento').value.trim().toUpperCase()
    };
    localStorage.setItem('bdsPosts', JSON.stringify(dbPosts));
    fecharModal('modalEditar');
    renderCronograma();
    toast('Post atualizado!', 'ok');
  }

  function deletar(idx) {
    if (confirm('Excluir este post do cronograma local?')) {
      dbPosts.splice(idx, 1);
      localStorage.setItem('bdsPosts', JSON.stringify(dbPosts));
      renderCronograma();
      toast('Post excluído', 'erro');
    }
  }

  function limparCronograma() {
    if (confirm('Apagar todos os posts salvos localmente?')) {
      dbPosts = [];
      localStorage.removeItem('bdsPosts');
      renderCronograma();
    }
  }

  // Transição suave ao sair da página
  function ir(url) {
    const app = document.getElementById('app');
    if (app) { app.classList.add('leaving'); setTimeout(() => window.location.href = url, 220); }
    else window.location.href = url;
  }
  // Intercepta todos os links internos
  document.addEventListener('click', function(e) {
    const a = e.target.closest('a[href]');
    if (a && !a.href.startsWith('http') && !a.target) {
      e.preventDefault(); ir(a.getAttribute('href'));
    }
  });
</script>
</body>
</html>
