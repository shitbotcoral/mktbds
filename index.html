<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BDS LOGIN</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #02122c;
      --panel:   #071a3e;
      --surface: #0a2150;
      --border:  #0e3272;
      --accent:  #ffb700;
      --accent-d:#cc8f00;
      --text:    #e8edf5;
      --muted:   #4a6fa5;
      --error:   #e03030;
      --radius:  10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      background: #010812;
      color: var(--text);
      height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    /* ── Shell do celular ── */
    .app {
      width: 100%; height: 100%; max-width: 420px;
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      animation: fadeUp 0.3s ease both;
    }
    @media (min-width: 440px) {
      .app { height: 94vh; max-height: 900px; border-radius: 20px; border: 2px solid #0a1a3a; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .app.leaving {
      animation: fadeDown 0.22s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(8px); }
    }

    /* ── Header ── */
    header {
      background: var(--panel);
      border-bottom: 2px solid var(--accent);
      padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .logo-img { max-width: 130px; height: auto; display: block; }
    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 2px; color: var(--text);
    }
    .header-title span { color: var(--accent); }

    /* ── Scroll content ── */
    .content {
      flex: 1; overflow-y: auto;
      padding: 28px 20px;
      display: flex; flex-direction: column; justify-content: center; gap: 16px;
    }
    .content::-webkit-scrollbar { width: 3px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-weight: 600; font-size: 11px; color: var(--muted);
    }

    input[type="text"], input[type="password"] {
      width: 100%; padding: 13px 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s, background 0.2s;
    }
    input:focus { border-color: var(--accent); background: #0d2860; }
    input.erro { border-color: var(--error); background: rgba(224,48,48,0.05); }

    .msg-erro {
      min-height: 18px; font-size: 11px; font-weight: 600;
      color: var(--error); margin-top: 2px;
    }

    .btn {
      width: 100%; padding: 15px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px;
      cursor: pointer; box-shadow: 0 4px 0 var(--accent-d);
      transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover { background: #ffc520; }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--border); font-size: 11px; font-weight: 500;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .link-sec { text-align: center; font-size: 13px; color: var(--muted); }
    .link-sec a {
      color: var(--accent); text-decoration: none;
      font-weight: 700; font-size: 12px;
    }
    .link-sec a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      padding: 12px 16px; background: #010812;
      border-top: 1px solid var(--border);
      font-size: 10px; font-weight: 500;
      color: var(--border); text-align: center; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <header>
    <img src="img/logobds.png" alt="Bet Dá Sorte" class="logo-img">
    <div class="header-title">Painel de <span>Marketing</span></div>
  </header>

  <div class="content">
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="loginNome" placeholder="Digite seu usuário" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginSenha" placeholder="Digite sua senha" autocomplete="current-password" required>
    </div>
    <div class="msg-erro" id="erroLogin"></div>
    <button class="btn" onclick="tentarLogin()">Entrar</button>

    <div class="divider">ou</div>

    <div class="link-sec">
      Não tem conta? <a href="#" onclick="ir('cadastro.html')">Cadastre-se</a>
    </div>
  </div>

  <footer>Sorte TV © 2026 · Marketing Digital · v2.0</footer>
</div>

<script>
  function ir(url) {
    const app = document.getElementById('app');
    app.classList.add('leaving');
    setTimeout(() => window.location.href = url, 220);
  }

  const inputNome  = document.getElementById('loginNome');
  const inputSenha = document.getElementById('loginSenha');
  const erroMsg    = document.getElementById('erroLogin');

  [inputNome, inputSenha].forEach(i => {
    i.addEventListener('input', () => { i.classList.remove('erro'); erroMsg.textContent = ''; });
  });

  function tentarLogin() {
    const nome  = inputNome.value.trim();
    const senha = inputSenha.value;
    const usuarios = JSON.parse(localStorage.getItem('bdsUsuarios') || localStorage.getItem('betUsuarios') || '{}');

    if (usuarios[nome] && usuarios[nome] === senha) {
      sessionStorage.setItem('bdsUsuario', nome);
      ir('hub.html');
    } else {
      inputNome.classList.add('erro');
      inputSenha.classList.add('erro');
      erroMsg.textContent = 'Usuário ou senha incorretos.';
      inputSenha.value = '';
      inputSenha.focus();
    }
  }

  // Enter submete
  [inputNome, inputSenha].forEach(i => {
    i.addEventListener('keydown', e => { if (e.key === 'Enter') tentarLogin(); });
  });
</script>
</body>
</html>
