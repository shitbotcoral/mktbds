<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub — Bet Dá Sorte</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0A192F;
      --panel:   #112240;
      --surface: #0d1f3c;
      --border:  #1a3a6e;
      --accent:  #FFD700;
      --accent-d:#cc9200;
      --blue:    #87CEEB;
      --text:    #e8edf5;
      --muted:   #4a7fa5;
      --radius:  12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Archivo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(ellipse at 80% 0%, rgba(255,215,0,0.04) 0%, transparent 55%),
                        radial-gradient(ellipse at 10% 100%, rgba(0,110,230,0.05) 0%, transparent 50%);
    }

    /* HEADER */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo img { height: 32px; width: auto; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-user {
      font-family: 'Archivo Black', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .header-user span { color: var(--accent); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: 'Archivo Black', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #FF4C4C; color: #FF4C4C; }

    /* MAIN */
    main {
      flex: 1;
      padding: 48px 32px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .main-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* GRID DE CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255,215,0,0.3);
      background: #15294f;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .card:hover::before { transform: scaleX(1); }

    .card-icon {
      width: 44px; height: 44px;
      background: rgba(255,215,0,0.08);
      border: 1px solid rgba(255,215,0,0.15);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .card-icon svg {
      width: 22px; height: 22px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 16px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card-arrow {
      margin-top: auto;
      font-family: 'Archivo Black', sans-serif;
      font-size: 10px;
      color: var(--border);
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .card:hover .card-arrow { color: var(--accent); }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      color: var(--border);
      font-family: 'Archivo Black', sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">
      <img src="logobetdasorte.png" alt="Bet Dá Sorte">
    </div>
    <div class="header-right">
      <div class="header-user">Olá, <span id="nomeUsuario"></span></div>
      <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </div>
  </header>

  <main>
    <div class="main-title">Ferramentas</div>

    <div class="cards-grid">

      <a href="pauta/index.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/></svg>
        </div>
        <div class="card-title">Pauta</div>
        <div class="card-desc">Gerencie e agende os conteúdos da semana no cronograma.</div>
        <div class="card-arrow">Acessar</div>
      </a>

      <a href="criadornoticia/index.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <div class="card-title">Criador de Notícia</div>
        <div class="card-desc">Monte artes de notícia com layouts e envie direto ao Trello.</div>
        <div class="card-arrow">Acessar</div>
      </a>

    </div>
  </main>

  <footer>BET DÁ SORTE © 2026 — SISTEMA INTERNO</footer>

  <script>
    const usuarioLogado = sessionStorage.getItem('usuarioLogado');
    if (!usuarioLogado) { window.location.href = 'index.html'; }
    else { document.getElementById('nomeUsuario').innerText = usuarioLogado; }

    function fazerLogout() {
      sessionStorage.removeItem('usuarioLogado');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
