<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB - Bet Dá Sorte</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0A192F; color: white; display: flex; flex-direction: column; align-items: center; padding-top: 50px; margin: 0; }
        .header { text-align: center; margin-bottom: 40px; }
        .logo { max-width: 250px; margin-bottom: 10px; }
        .welcome-text { color: #87CEEB; font-size: 1.2em; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background-color: #112240; width: 250px; padding: 40px 20px; border-radius: 10px; text-align: center; text-decoration: none; color: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 4px solid transparent; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2); border-bottom: 4px solid #FFD700; background-color: #1a365d; }
        .card h2 { margin: 0; font-size: 1.5em; color: #FFD700; }
        .card p { color: #87CEEB; }
        .logout { margin-top: 50px; background-color: transparent; border: 1px solid #FF4C4C; color: #FF4C4C; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .logout:hover { background-color: #FF4C4C; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logobetdasorte.png" alt="Logo Bet Dá Sorte" class="logo">
        <p class="welcome-text">Bem-vindo(a), <span id="nomeUsuario" style="color: #FFD700; font-weight: bold;"></span>!</p>
    </div>

    <div class="container">
        <a href="pauta/index.html" class="card">
            <h2>PAUTA</h2>
            <p>Gerencie os assuntos</p>
        </a>

        <a href="criadornoticia/index.html" class="card">
            <h2>CRIADOR DE NOTÍCIA</h2>
            <p>Monte os conteúdos</p>
        </a>
    </div>

    <button class="logout" onclick="fazerLogout()">Sair do Sistema</button>

    <script>
        const usuarioLogado = sessionStorage.getItem('usuarioLogado');
        
        if (!usuarioLogado) {
            window.location.href = "index.html";
        } else {
            document.getElementById('nomeUsuario').innerText = usuarioLogado;
        }

        function fazerLogout() {
            sessionStorage.removeItem('usuarioLogado');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
