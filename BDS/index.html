<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bet Dá Sorte</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0A192F; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #112240; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); width: 100%; max-width: 350px; text-align: center; }
        .logo { max-width: 200px; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 2px solid transparent; border-radius: 4px; outline: none; transition: 0.3s; }
        input:focus { border: 2px solid #87CEEB; }
        
        /* Estilos de Erro */
        .input-erro { border: 2px solid #FF4C4C !important; background-color: #FFE6E6; color: #333; }
        .mensagem-erro { color: #FF4C4C; font-size: 14px; margin-top: -5px; margin-bottom: 10px; min-height: 16px; font-weight: bold; }

        button { background-color: #FFD700; color: #0A192F; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 5px; transition: 0.3s; }
        button:hover { background-color: #FFC107; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .link { margin-top: 20px; display: block; color: #87CEEB; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .link:hover { color: #00BFFF; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logobetdasorte.png" alt="Logo Bet Dá Sorte" class="logo">
        <form id="formLogin">
            <input type="text" id="loginNome" placeholder="Nome de Usuário" required>
            <input type="password" id="loginSenha" placeholder="Senha" required>
            
            <div id="erroLogin" class="mensagem-erro"></div>
            
            <button type="submit">Entrar</button>
        </form>
        <a href="cadastro.html" class="link">Não tem conta? Cadastre-se</a>
    </div>

    <script>
        const inputNome = document.getElementById('loginNome');
        const inputSenha = document.getElementById('loginSenha');
        const erroMsg = document.getElementById('erroLogin');

        // Limpa a marcação de erro quando o usuário digita
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('input-erro');
                erroMsg.innerText = "";
            });
        });

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = inputNome.value.trim();
            const senha = inputSenha.value;

            let usuarios = JSON.parse(localStorage.getItem('betUsuarios')) || {};

            if (usuarios[nome] && usuarios[nome] === senha) {
                sessionStorage.setItem('usuarioLogado', nome);
                window.location.href = "hub.html";
            } else {
                // Aplica o visual de erro
                inputNome.classList.add('input-erro');
                inputSenha.classList.add('input-erro');
                erroMsg.innerText = "Usuário ou senha incorretos!";
            }
        });
    </script>
</body>
</html>
