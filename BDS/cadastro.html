<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bet Dá Sorte</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #333; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #00ff88; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: none; border-radius: 4px; }
        button { background-color: #00ff88; color: #1a1a1a; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:hover { background-color: #00cc6a; }
        .link { margin-top: 15px; display: block; color: #aaa; text-decoration: none; font-size: 14px; }
        .link:hover { color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Criar Conta</h2>
        <form id="formCadastro">
            <input type="text" id="nome" placeholder="Nome de Usuário" required>
            <input type="password" id="senha" placeholder="Senha" minlength="4" required>
            <input type="password" id="confirmaSenha" placeholder="Confirmar Senha" minlength="4" required>
            <button type="submit">Cadastrar</button>
        </form>
        <a href="index.html" class="link">Já tem conta? Faça Login</a>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault(); // Impede a página de recarregar
            
            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (senha !== confirmaSenha) {
                alert("As senhas não coincidem. Tente novamente, fera!");
                return;
            }

            // Puxa usuários antigos ou cria uma lista vazia
            let usuarios = JSON.parse(localStorage.getItem('betUsuarios')) || {};

            if (usuarios[nome]) {
                alert("Esse nome de usuário já existe!");
                return;
            }

            // Salva o novo usuário
            usuarios[nome] = senha;
            localStorage.setItem('betUsuarios', JSON.stringify(usuarios));

            alert("Cadastro realizado com sucesso! Agora é só fazer login.");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
