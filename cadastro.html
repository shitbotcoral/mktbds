<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Bet Dá Sorte</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0A192F;
      --panel:   #112240;
      --border:  #1a3a6e;
      --accent:  #FFD700;
      --accent-d:#cc9200;
      --text:    #e8edf5;
      --muted:   #4a7fa5;
      --error:   #FF4C4C;
      --radius:  10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Archivo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(ellipse at 60% 0%, rgba(255,215,0,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 10% 100%, rgba(0,110,230,0.06) 0%, transparent 50%);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo-wrap img { max-width: 150px; height: auto; }
    .page-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-family: 'Archivo Black', sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Archivo', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--accent-d);
      transition: all 0.1s;
    }
    .btn:hover { background: #ffe033; }
    .btn:active { transform: translateY(4px); box-shadow: none; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
      color: var(--border);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .link-sec {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .link-sec a {
      color: var(--accent);
      text-decoration: none;
      font-family: 'Archivo Black', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .link-sec a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="logobetdasorte.png" alt="Bet Dá Sorte">
    </div>
    <div class="page-title">Criar Conta</div>

    <form id="formCadastro">
      <div class="field">
        <label>Usuário</label>
        <input type="text" id="nome" placeholder="Escolha um nome de usuário" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 4 caracteres" minlength="4" required>
      </div>
      <div class="field">
        <label>Confirmar Senha</label>
        <input type="password" id="confirmaSenha" placeholder="Repita a senha" minlength="4" required>
      </div>
      <button type="submit" class="btn">Cadastrar</button>
    </form>

    <div class="divider">ou</div>

    <div class="link-sec">
      Já tem conta? <a href="index.html">Faça login</a>
    </div>
  </div>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
      e.preventDefault();
      const nome         = document.getElementById('nome').value.trim();
      const senha        = document.getElementById('senha').value;
      const confirmaSenha = document.getElementById('confirmaSenha').value;

      if (senha !== confirmaSenha) { alert('As senhas não coincidem.'); return; }

      let usuarios = JSON.parse(localStorage.getItem('betUsuarios')) || {};
      if (usuarios[nome]) { alert('Esse nome de usuário já existe.'); return; }

      usuarios[nome] = senha;
      localStorage.setItem('betUsuarios', JSON.stringify(usuarios));
      alert('Cadastro realizado! Agora é só fazer login.');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
